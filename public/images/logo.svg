<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3B40"/>
      <stop offset="100%" stop-color="#28292D"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D92D43"/>
      <stop offset="100%" stop-color="#A81D30"/>
    </linearGradient>
  </defs>

  <!-- Store Signboard Outer Frame (Arch Top shape matching the store sign) -->
  <path d="M 40,36 
           L 180,36 
           C 200,12 280,12 300,36 
           L 440,36 
           A 16,16 0 0 1 456,52 
           L 456,128 
           A 16,16 0 0 1 440,144 
           L 40,144 
           A 16,16 0 0 1 24,128 
           L 24,52 
           A 16,16 0 0 1 40,36 Z" 
        fill="url(#charcoalGrad)" 
        stroke="#E6E8EC" 
        stroke-width="3" 
        filter="url(#shadow)" />

  <!-- Inner Sign Border Inset -->
  <path d="M 44,42 
           L 182,42 
           C 202,20 278,20 298,42 
           L 436,42 
           A 10,10 0 0 1 446,52 
           L 446,124 
           A 10,10 0 0 1 436,134 
           L 44,134 
           A 10,10 0 0 1 34,124 
           L 34,52 
           A 10,10 0 0 1 44,42 Z" 
        fill="none" 
        stroke="#9B9EA7" 
        stroke-width="1.5" 
        stroke-dasharray="6,3" 
        opacity="0.6"/>

  <!-- Rooster / Chicken Icon in the Top Crown -->
  <g transform="translate(240, 29) scale(0.75)" text-anchor="middle">
    <!-- Rooster Silhouette Outline matching storefront sign -->
    <path d="M -12,2 C -15,0 -16,-6 -14,-10 C -12,-14 -6,-16 -2,-14 C 0,-18 5,-18 8,-15 C 12,-16 16,-12 15,-8 C 19,-6 20,-1 18,3 C 16,8 11,10 6,10 L -6,10 C -10,8 -12,5 -12,2 Z" fill="#E24A5E" opacity="0.9"/>
    <!-- Comb & beak -->
    <path d="M -4,-12 C -4,-16 -1,-18 2,-16 C 5,-18 8,-15 7,-12 Z" fill="#B9253A"/>
    <polygon points="12,-6 18,-4 13,-2" fill="#FBBF24"/>
    <!-- Chicken body and tail -->
    <path d="M -14,1 C -20,-2 -22,8 -16,14 C -12,18 -4,19 4,18 C 12,17 17,11 16,4 C 14,-2 1,-3 -2,4 C -4,10 -10,10 -12,6 Z" fill="#FFFFFF"/>
    <!-- Eye dot -->
    <circle cx="6" cy="-6" r="1.5" fill="#28292D"/>
  </g>

  <!-- Typography: NAZAR PILIÇ -->
  <!-- "Nazar" in Red Gradient with crisp white outline -->
  <text x="145" y="94" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="0.5"
        fill="url(#redGrad)" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        stroke-linejoin="round"
        text-anchor="middle">Nazar</text>

  <!-- "Piliç" in Warm White/Silver with red glow -->
  <text x="325" y="94" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="0.5"
        fill="#FFFFFF" 
        stroke="#B9253A" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        text-anchor="middle">Piliç</text>

  <!-- Center divider accent lines -->
  <line x1="80" y1="112" x2="160" y2="112" stroke="#9B9EA7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="170" cy="112" r="2.5" fill="#B9253A"/>
  
  <!-- "2005'ten bu yana" Subtitle matching the storefront sign -->
  <text x="240" y="117" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="14" 
        font-weight="600" 
        font-style="italic"
        letter-spacing="1.5" 
        fill="#E6E8EC" 
        text-anchor="middle">2005'ten bu yana</text>

  <circle cx="310" cy="112" r="2.5" fill="#B9253A"/>
  <line x1="320" y1="112" x2="400" y2="112" stroke="#9B9EA7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
